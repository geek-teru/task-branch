# Reusable: apply (or preview) supabase/migrations on the linked Supabase project.
# Called by release.yml (apply) and pull-request.yml (dry run).
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN  personal access token (Supabase → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   database password of the project
#   SUPABASE_PROJECT_ID    project ref (the <ref> in https://<ref>.supabase.co)
#
# Never pass --include-seed here: the seed files re-create the sample projects
# (they delete projects by name before inserting) and would reset production data.
name: supabase-migrations

on:
  workflow_call:
    inputs:
      dry_run:
        description: "true: only list the migrations that would be applied"
        type: boolean
        default: false
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: false
      SUPABASE_DB_PASSWORD:
        required: false
      SUPABASE_PROJECT_ID:
        required: false

permissions:
  contents: read

jobs:
  migrate:
    name: ${{ inputs.dry_run && 'migration plan (dry run)' || 'migrate' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      # Secrets are missing on forks and before they are registered.
      # A dry run just reports that; a real migration must not silently skip.
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::Supabase secrets are not set; skipping the migration plan."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Supabase secrets (SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_ID) are not set."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.configured == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.configured == 'true'
        with:
          version: 2.117.0 # same as local development; bump together

      - name: Link project
        if: steps.secrets.outputs.configured == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations${{ inputs.dry_run && ' (dry run)' || '' }}
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -o pipefail
          supabase db push ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | tee push.log
          {
            echo "### Supabase migrations${{ inputs.dry_run && ' (dry run)' || '' }}"
            echo '```'
            cat push.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
