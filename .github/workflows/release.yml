# Production release, run on every push to main.
#
# Today:  migrate only. The screen is deployed by Vercel's own Git integration at the
#         same time, so migrations must stay backward compatible with the currently
#         deployed screen (add columns/tables first; drop or rename in a later release).
#
# Later:  migrate → deploy. Turn off Vercel's automatic production deploys and add a
#         `deploy` job with `needs: migrate` (see the commented example below).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production release at a time; never cancel a migration halfway.
concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    uses: ./.github/workflows/supabase-migrations.yml
    with:
      dry_run: false
      environment: prd
    secrets: inherit

