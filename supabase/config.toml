# Supabase local config for task-branch.
# If your Supabase CLI version rejects any key here, regenerate with
# `supabase init` (it will not touch migrations/ or seed.sql).

project_id = "task-branch"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./sample01.sql", "./sample02.sql"]
